name: Build APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Download Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          cd gradle/wrapper
          curl -L https://repo.gradle.org/gradle/libs-releases-local/org/gradle/gradle-wrapper/9.3.1/gradle-wrapper-9.3.1.jar -o gradle-wrapper.jar

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vortex-browser-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vortex-browser-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
